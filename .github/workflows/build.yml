name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up x86 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install SCons
        run: python -m pip install scons

      - name: Install x86 static OpenSSL
        shell: pwsh
        run: |
          $vcpkgPath = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgPath
          & (Join-Path $vcpkgPath "bootstrap-vcpkg.bat") -disableMetrics
          & (Join-Path $vcpkgPath "vcpkg.exe") install openssl:x86-windows-static

          $installedPath = Join-Path $vcpkgPath "installed/x86-windows-static"
          "OPENSSL_INCLUDE_PATH=$(Join-Path $installedPath 'include')" >> $env:GITHUB_ENV
          "OPENSSL_LIB_PATH=$(Join-Path $installedPath 'lib')" >> $env:GITHUB_ENV
          "OPENSSL_LIBRARIES=libssl;libcrypto" >> $env:GITHUB_ENV

      - name: Build launcher
        run: scons -Q

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: CODMVM_LAUNCHER
          path: bin/CODMVM_LAUNCHER.exe
          if-no-files-found: error
